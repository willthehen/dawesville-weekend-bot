# Writes the weekend message on Thursday and saves it to latest.json.
# GitHub's clock is UTC. Perth is UTC+8, so 01:23 UTC = 9:23am Perth.
#
# Three ways a run can start - any one of them is enough:
#   1. GitHub's timer, hourly 9:23am-5:23pm Perth on Thursdays (it's "best effort" and can skip)
#   2. Your iPhone's Thursday 3pm "Wake Weekend Bot" automation
#   3. You pressing "Run workflow" on GitHub
# Once today's message is written, later runs do nothing (unless you tick "force").
#
# On other days GitHub's timer runs once at 11:23am Perth as a free health check:
# it writes nothing, but a green tick in the Actions tab proves the timer is working.
name: Weekly Dawesville message

on:
  schedule:
    - cron: "23 1-9 * * 4"         # Thursday, hourly 9:23am-5:23pm Perth
    - cron: "23 3 * * 0-3,5,6"     # other days, 11:23am Perth - health check only
  workflow_dispatch:
    inputs:
      force:
        description: "Replace today's message even if one is already written"
        type: boolean
        default: false

permissions:
  contents: write           # needed to save latest.json back into the repo

concurrency: weekly-message

jobs:
  write-message:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Write the message
        run: >-
          python weekend_bot.py
          ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
          ${{ inputs.force && '--force' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save it to the repo
        run: |
          git config user.name "weekend-bot"
          git config user.email "weekend-bot@users.noreply.github.com"
          git add latest.json history.jsonl
          git diff --cached --quiet || git commit -m "Weekend message for $(TZ=Australia/Perth date +%F)"
          git push
