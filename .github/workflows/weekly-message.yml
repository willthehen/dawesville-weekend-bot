# Writes the weekend message on Thursday and saves it to latest.json.
# GitHub's clock is UTC. Perth is UTC+8, so 01:23 UTC = 9:23am Perth.
# GitHub's timer is "best effort" and sometimes skips runs, so it tries every hour from
# 9:23am to 5:23pm Perth. Once one run has written today's message, the rest do nothing.
name: Weekly Dawesville message

on:
  schedule:
    - cron: "23 1-9 * * 4"   # Thursday, hourly 9:23am-5:23pm Perth
  workflow_dispatch:        # lets you press "Run workflow" by hand (always writes a fresh message)

permissions:
  contents: write           # needed to save latest.json back into the repo

concurrency: weekly-message

jobs:
  write-message:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Write the message
        run: python weekend_bot.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save it to the repo
        run: |
          git config user.name "weekend-bot"
          git config user.email "weekend-bot@users.noreply.github.com"
          git add latest.json history.jsonl
          git diff --cached --quiet || git commit -m "Weekend message for $(TZ=Australia/Perth date +%F)"
          git push
